# Please note that this is a duplicate. The source is in chapters/development.org.
name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [11]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v2
      with:
        java-version: ${{ matrix.java }}

    - name: Install Clojure CLI
      run: |
        curl -O https://download.clojure.org/install/linux-install-1.10.3.998.sh
        chmod +x linux-install-1.10.3.998.sh
        sudo ./linux-install-1.10.3.998.sh

    - name: Install Babashka
      run: |
        curl -sLO https://github.com/babashka/babashka/releases/download/v0.8.158/babashka-0.8.158-linux-amd64.tar.gz
        tar -xzf babashka-0.8.158-linux-amd64.tar.gz
        sudo mv bb /usr/local/bin/bb

    - name: Run unit tests
      run: clojure -M:test

    - name: Run integration tests
      run: bb -cp "$(clojure -Spath -Mtest)" run-tests.bb
